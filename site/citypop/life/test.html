<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Test Bench</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07081a; overflow: hidden; font: 12px/1.4 monospace; color: #d8d0f0; }
  #bg, #life { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bg { image-rendering: pixelated; }
  #life { pointer-events: none; }
  #hud { position: fixed; right: 8px; bottom: 8px; background: rgba(7, 8, 26, .8); padding: 6px 8px; border: 1px solid #33226a; max-width: 340px; }
  #hud input { width: 160px; vertical-align: middle; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="life"></div>
<div id="hud"><label>hour <input id="h" type="range" min="19.5" max="29.5" step="0.1"> <b id="hv"></b></label><div id="st"></div></div>
<script src="life.js"></script>
<script>
// The old 320x200 scene drawn exactly as app.js places it (integer scale, cover, 62% down), with life on top.
// Query: ?speed=N (time runs N times faster), ?h=26 (hour), ?scene=2 (use window.Scene if the scene lane's script is present), ?reduced=1, ?hud=0
const q = new URLSearchParams(location.search);
const bg = document.getElementById('bg'), g = bg.getContext('2d'), img = new Image();
function fit() {
  const dpr = devicePixelRatio || 1, cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
  bg.width = cw; bg.height = ch; const s = Math.max(1, Math.ceil(Math.max(cw / 320, ch / 200)));
  g.imageSmoothingEnabled = false; g.drawImage(img, Math.floor((cw - 320 * s) / 2), Math.floor((ch - 200 * s) * 0.62), 320 * s, 200 * s);
}
img.onload = fit; img.src = '../art/scene.png'; addEventListener('resize', fit);
if (q.get("off") === "1") window.life = { stats: () => ({}) }; else window.life = CityLife.start(document.getElementById('life'), {
  dpr: devicePixelRatio, reduced: q.get('reduced') === '1', scene: null, oldScene: '../art/scene.json',
  timeScale: +(q.get('speed') || 1), hours: +(q.get('h') || 26), only: q.get('only') ? q.get('only').split(',') : null,
});
const life = window.life;
const h = document.getElementById('h'), hv = document.getElementById('hv');
h.value = q.get('h') || 26; hv.textContent = h.value;
h.oninput = () => { life.setTime(+h.value); hv.textContent = h.value; };
if (q.get('hud') === '0') document.getElementById('hud').hidden = true;
setInterval(() => { const s = life.stats(); document.getElementById('st').textContent = `${s.actors} things, ${s.kinds} kinds, ${s.fps} fps, ${(s.drawnPxPerSec / 1e6).toFixed(2)} Mpx/s, U=${s.U}`; }, 1000);
</script>
</body>
</html>
