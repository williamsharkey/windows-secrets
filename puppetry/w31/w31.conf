[sdl]
autolock=false
output=surface
showmenu=false
windowposition=0,0
[dosbox]
machine=svga_s3
memsize=64
quit warning=false
startbanner=false
working directory default=/root/snap/dosbox-x/common/w31
[cpu]
cputype=pentium
core=normal
cycles=max
[render]
scaler=none
[serial]
serial1=nullmodem server:127.0.0.1 port:8772 transparent:1
serial2=nullmodem server:127.0.0.1 port:8792 transparent:1
[autoexec]
mount c /root/snap/dosbox-x/common/w31/run
c:
SET TEMP=C:\WINDOWS\TEMP
SET PATH=C:\WINDOWS;C:\WATCOM\BINW
SET WATCOM=C:\WATCOM
SET INCLUDE=C:\WATCOM\H;C:\WATCOM\H\WIN
cd \WINDOWS
WIN.COM
