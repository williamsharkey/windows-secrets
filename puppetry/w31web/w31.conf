[dosbox]
machine=svga_s3
memsize=64
[cpu]
cputype=pentium
core=normal
cycles=fixed 60000
[render]
scaler=none
[mixer]
rate=48000
[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5
[speaker]
pcspeaker=false
[autoexec]
mount c /machine/c
c:
SET BLASTER=A220 I5 D1 H5 P330 T6
SET TEMP=C:\WINDOWS\TEMP
SET PATH=C:\WINDOWS;C:\WATCOM\BINW
SET WATCOM=C:\WATCOM
SET INCLUDE=C:\WATCOM\H;C:\WATCOM\H\WIN
cd \WINDOWS
WIN.COM
